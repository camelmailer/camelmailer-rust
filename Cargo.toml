[package]
name = "camelmailer-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust SDK for Camelmailer — the open-source transactional email platform"
license = "MIT"
repository = "https://github.com/camelmailer/camelmailer-rust"
homepage = "https://camelmailer.com"
documentation = "https://docs.rs/camelmailer-rs"
readme = "README.md"
keywords = ["email", "camelmailer", "transactional", "smtp", "api"]
categories = ["email", "api-bindings", "web-programming::http-client"]

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"], optional = true }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
default = []
blocking = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
